name: Daily news digests

on:
  schedule:
    # 7am Australia/Sydney is 20:00 UTC (AEDT) or 21:00 UTC (AEST). GitHub runs
    # scheduled crons late and skips top-of-hour (:00) ones under load, so we fire
    # several times each morning at an off-peak minute (:17). The Python code sends
    # once when Sydney time is in the 07:00–11:59 window and records the date, so
    # exactly one digest goes out per day no matter which run lands first — and a
    # late/skipped run can't cause a miss.
    - cron: "17 20-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, ignoring the morning-window gate"
        type: boolean
        default: true

concurrency:
  group: news-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run digests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_CYBER: ${{ secrets.DISCORD_WEBHOOK_CYBER }}
          DISCORD_WEBHOOK_TECH: ${{ secrets.DISCORD_WEBHOOK_TECH }}
          DISCORD_WEBHOOK_AI: ${{ secrets.DISCORD_WEBHOOK_AI }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python -m src.news.digest --force
          else
            python -m src.news.digest
          fi

      - name: Commit digest state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/digest_state.json
          if git diff --cached --quiet; then
            echo "No digest-state change."
            exit 0
          fi
          git commit -m "chore(news): mark daily digest sent [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push || (git pull --rebase --autostash origin "${{ github.ref_name }}" && git push)
