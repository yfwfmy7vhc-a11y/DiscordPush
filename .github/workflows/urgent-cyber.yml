name: Urgent AU cyber alerts

on:
  schedule:
    - cron: "0 * * * *" # hourly (UTC)
  workflow_dispatch: {}

concurrency:
  group: urgent-cyber
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan for urgent incidents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URGENT: ${{ secrets.DISCORD_WEBHOOK_URGENT }}
        run: python -m src.news.urgent

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore(urgent): update seen-articles state [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push || (git pull --rebase --autostash origin "${{ github.ref_name }}" && git push)
