name: Pokémon price monitor

on:
  schedule:
    # Every 30 minutes (UTC). GitHub cron timing is best-effort, not exact.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Prevent overlapping runs from racing on the state commit.
concurrency:
  group: pokemon-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          DISCORD_WEBHOOK_CARDS: ${{ secrets.DISCORD_WEBHOOK_CARDS }}
          # Optional: enables PriceCharting market-value context in alerts.
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
        run: python -m src.pokemon.monitor

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore(pokemon): update seen-listings state [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push || (git pull --rebase --autostash origin "${{ github.ref_name }}" && git push)
